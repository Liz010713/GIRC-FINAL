services:
  db:
    image: postgres:16-alpine
    container_name: girc-db
    environment:
      POSTGRES_DB: ${DB_NAME:-girc_db}
      POSTGRES_USER: ${DB_USER:-girc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-girc-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-girc} -d ${DB_NAME:-girc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: girc-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-girc_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-girc}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-girc-local-only}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: girc-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
